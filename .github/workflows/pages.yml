name: Deploy Afilia

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('app.js?v=040', 'app.js?v=050')
          text = text.replace('Afilia 0.4 •', 'Afilia 0.5 •')
          if 'templates.js?v=051' not in text:
              text = text.replace('</body>', '<script type="module" src="./templates.js?v=051"></script>\n</body>')
          if 'whatsapp.js?v=053' not in text:
              text = text.replace('<script type="module" src="./whatsapp.js?v=052"></script>', '<script type="module" src="./whatsapp.js?v=053"></script>')
              if 'whatsapp.js?v=053' not in text:
                  text = text.replace('</body>', '<script type="module" src="./whatsapp.js?v=053"></script>\n</body>')
          if 'whatsapp-gateway-client.js?v=060' not in text:
              text = text.replace('</body>', '<script type="module" src="./whatsapp-gateway-client.js?v=060"></script>\n</body>')
          index.write_text(text, encoding='utf-8')
          PY

      - name: Verify production wiring
        shell: bash
        run: |
          grep -q 'app.js?v=050' index.html
          grep -q 'templates.js?v=051' index.html
          grep -q 'whatsapp.js?v=053' index.html
          grep -q 'whatsapp-gateway-client.js?v=060' index.html
          grep -q 'user-scalable=no' index.html
          grep -q 'Telegram para operação' index.html
          grep -q 'data-target="password"' auth.html
          grep -q "afilia-v12" sw.js
          grep -q 'openTemplatesManager' templates.js
          grep -q 'openWhatsAppManager' whatsapp.js
          grep -q 'AFILIA_WA_GATEWAY' whatsapp-gateway-client.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4