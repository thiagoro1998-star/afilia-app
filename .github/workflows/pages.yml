name: Deploy Afilia

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('app.js?v=040', 'app.js?v=050')
          text = text.replace('Afilia 0.4 •', 'Afilia 0.5 •')
          if 'templates.js?v=051' not in text:
              text = text.replace('</body>', '<script type="module" src="./templates.js?v=051"></script>\n</body>')
          for old in ['whatsapp.js?v=052','whatsapp.js?v=053','whatsapp.js?v=054','whatsapp.js?v=055']:
              text = text.replace(old,'whatsapp.js?v=056')
          if 'whatsapp.js?v=056' not in text:
              text = text.replace('</body>', '<script type="module" src="./whatsapp.js?v=056"></script>\n</body>')
          for old in ['whatsapp-gateway-client.js?v=060','whatsapp-gateway-client.js?v=061']:
              text = text.replace(old,'whatsapp-gateway-client.js?v=062')
          if 'whatsapp-gateway-client.js?v=062' not in text:
              text = text.replace('</body>', '<script type="module" src="./whatsapp-gateway-client.js?v=062"></script>\n</body>')
          if 'account-session.js?v=001' not in text:
              text = text.replace('</body>', '<script type="module" src="./account-session.js?v=001"></script>\n</body>')
          index.write_text(text, encoding='utf-8')
          PY

      - name: Verify production wiring
        shell: bash
        run: |
          grep -q 'app.js?v=050' index.html
          grep -q 'templates.js?v=051' index.html
          grep -q 'whatsapp.js?v=056' index.html
          grep -q 'whatsapp-gateway-client.js?v=062' index.html
          grep -q 'account-session.js?v=001' index.html
          grep -q 'user-scalable=no' index.html
          grep -q 'Telegram para operação' index.html
          grep -q 'data-target="password"' auth.html
          grep -q "afilia-v15" sw.js
          grep -q 'openTemplatesManager' templates.js
          grep -q 'openWhatsAppManager' whatsapp.js
          grep -q 'syncWhatsAppGroups' whatsapp.js
          grep -q "AFILIA_WA_GATEWAY='railway-persistent'" whatsapp-gateway-client.js
          grep -q 'logoutAfiliaIsolated' account-session.js
          grep -q 'disconnectWhatsAppAccount' account-session.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
