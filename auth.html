<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090b"><meta name="apple-mobile-web-app-capable" content="yes"><title>Afilia • Entrar</title><style>:root{--bg:#07090b;--card:#11151a;--line:#29313a;--text:#f6f7f9;--muted:#8c97a6;--lime:#d4ff32;--green:#45df8e;--red:#ff8b8b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:26px 20px;background:radial-gradient(620px 420px at 100% 0,rgba(212,255,50,.08),transparent 60%),#07090b}.wrap{width:min(440px,100%)}.brand{display:flex;align-items:center;gap:14px;margin:4px 0 28px}.logo{width:64px;height:64px;border-radius:20px;background:var(--lime);color:#080b04;display:grid;place-items:center;font-size:34px;font-weight:1000}.brand h1{font-size:30px;margin:0;letter-spacing:-.04em}.brand p{margin:4px 0 0;color:var(--muted)}.card{background:linear-gradient(145deg,#151a20,#0e1216);border:1px solid var(--line);border-radius:30px;padding:24px}.card h2{font-size:32px;margin:0 0 8px;letter-spacing:-.05em}.card>p{margin:0;color:var(--muted);line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#090c0f;border:1px solid #252c34;border-radius:16px;padding:5px;margin:22px 0 12px}.tab{border:0;background:transparent;color:#84909e;border-radius:12px;padding:12px;font-weight:900}.tab.on{background:#20262d;color:#fff}.field{margin-top:13px}.field label{display:block;font-size:11px;font-weight:900;letter-spacing:.06em;color:#b5bec9;margin:0 2px 7px}.field input{width:100%;border:1px solid #2b343e;background:#0b0f13;color:white;border-radius:16px;padding:15px;font-size:16px;outline:none}.btn{width:100%;border:0;border-radius:17px;padding:15px;font-size:16px;font-weight:1000;margin-top:15px}.primary{background:var(--lime);color:#080b04}.secondary{background:#20262d;color:#fff}.status{display:none;margin-top:14px;border-radius:15px;padding:13px;line-height:1.4;font-size:13px}.status.show{display:block}.status.ok{background:#10251c;border:1px solid #286744;color:#9be7bc}.status.err{background:#281719;border:1px solid #71383d;color:#ffb1b1}.hidden{display:none}.secure{margin-top:18px;color:#75818f;text-align:center;font-size:11px;line-height:1.5}.loading{text-align:center;color:#8c97a6;padding:20px}</style></head><body><main class="wrap"><div class="brand"><div class="logo">A</div><div><h1>Afilia</h1><p>suas ofertas, no ritmo certo</p></div></div><section class="card"><div id="loading" class="loading">Verificando sua conta…</div><div id="auth" class="hidden"><h2 id="title">Acesse o Afilia</h2><p id="subtitle">Entre para acessar suas ofertas, integrações e automações.</p><div class="tabs"><button id="loginTab" class="tab on">Entrar</button><button id="signupTab" class="tab">Criar conta</button></div><div id="nameWrap" class="field hidden"><label>NOME</label><input id="name" autocomplete="name" placeholder="Seu nome"></div><div class="field"><label>E-MAIL</label><input id="email" type="email" autocomplete="email" placeholder="voce@email.com"></div><div class="field"><label>SENHA</label><input id="password" type="password" autocomplete="current-password" placeholder="Sua senha"></div><button id="go" class="btn primary">Entrar</button><button id="forgot" class="btn secondary">Esqueci minha senha</button><div id="status" class="status"></div></div></section><div class="secure">🔐 Sua conta e suas integrações são individuais e protegidas.</div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const APP_URL='https://thiagoro1998-star.github.io/afilia-app/';const AUTH_URL=APP_URL+'auth.html';const supabase=createClient('https://yjgwlofhordbmjomxcdx.supabase.co','sb_publishable_qASwZXIwsbouYZpC-X0YWA_675aTqWN',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);let mode='login';function show(t,ok=false){const s=$('status');s.textContent=t;s.className='status show '+(ok?'ok':'err')}function setMode(m){mode=m;const x=m==='signup';$('loginTab').classList.toggle('on',!x);$('signupTab').classList.toggle('on',x);$('nameWrap').classList.toggle('hidden',!x);$('title').textContent=x?'Crie sua conta':'Acesse o Afilia';$('subtitle').textContent=x?'Crie sua conta para começar a organizar suas ofertas.':'Entre para acessar suas ofertas, integrações e automações.';$('go').textContent=x?'Criar conta':'Entrar';$('password').autocomplete=x?'new-password':'current-password'}$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');$('go').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim();if(!email||!password)return show('Preencha e-mail e senha.');if(mode==='signup'&&password.length<6)return show('Use uma senha com pelo menos 6 caracteres.');$('go').disabled=true;$('go').textContent='Aguarde…';try{if(mode==='login'){const{error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;location.replace('./index.html')}else{const{data,error}=await supabase.auth.signUp({email,password,options:{data:{name},emailRedirectTo:AUTH_URL}});if(error)throw error;if(data.session)location.replace('./index.html');else{show('Conta criada. Confirme o e-mail e depois volte ao Afilia para entrar.',true);$('go').disabled=false;setMode('login')}}}catch(e){const m=String(e?.message||'');show(m.includes('Invalid login credentials')?'E-mail ou senha incorretos.':'Não foi possível concluir agora. Tente novamente.');$('go').disabled=false;$('go').textContent=mode==='signup'?'Criar conta':'Entrar'}};$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email)return show('Digite seu e-mail primeiro.');const{error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:AUTH_URL});show(error?'Não foi possível enviar agora.':'Enviamos as instruções para seu e-mail.',!error)};(async()=>{const{data:{session}}=await supabase.auth.getSession();$('loading').classList.add('hidden');if(session)location.replace('./index.html');else $('auth').classList.remove('hidden')})();</script></body></html>
